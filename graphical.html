<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DEEPCORE — Bedrock edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#172a2b">
<link rel="stylesheet" href="graphical.css">
<link rel="stylesheet" href="editions.css">
</head>
<body>
<main id="game" aria-label="Deepcore, Bedrock edition">
  <header id="topbar"></header>
  <div id="resources" aria-label="Rig inventory"></div>
  <div id="workspace">
    <section id="world" aria-label="Stratum map">
      <canvas id="screen" tabindex="0" aria-label="Stratum. Arrow keys move the cursor. Enter interacts. Number keys choose a build tool."></canvas>
      <div id="map-caption"></div>
      <div id="map-controls"></div>
    </section>
    <aside id="operations" aria-label="Rig operations"></aside>
  </div>
  <nav id="toolbelt" aria-label="Construction tools"></nav>
  <footer id="statusbar"></footer>
  <section id="pages" aria-label="Game screen"></section>
  <section id="modal" aria-label="Pause menu"></section>
</main>
<noscript>Deepcore requires JavaScript. This edition works offline, with no downloads or accounts.</noscript>
<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/barks.js"></script>
<script src="js/map.js"></script>
<script src="js/sim.js"></script>
<script src="js/meta.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/events.js"></script>
<script src="js/worms.js"></script>
<script src="js/audio.js"></script>
<script src="js/atelier.js"></script>
<script src="js/graphical.js"></script>
<script src="js/engine.js"></script>
<script src="js/editions.js"></script>
<script src="js/main.js"></script>
</body>
</html>
